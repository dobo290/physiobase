# Checks and build. Runs on every push to master and on every tag.
# Docker Hub mirror: same official image, no anonymous pull limit
image = "mirror.gcr.io/library/golang:1.27.4"
work_dir = "/ci/build"
clone_project_to = "/ci/build/project"
shell_setup = "set -euo pipefail"
timeout = 1800
memory_limit = "3g"

cache = [
  { path = "/go/pkg/mod", max_size = "1g" },
  { path = "/root/.cache/go-build", max_size = "1g" },
]

[on]
push = ["master", "main"]
tag = true

[[steps]]
name = "tools"
run_sh = """
go install mvdan.cc/gofumpt@latest
go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
go install golang.org/x/vuln/cmd/govulncheck@latest
"""

[[steps]]
name = "tidy"
# The checkout has no .git, so compare copies instead of using git diff.
run_sh = "cd project && cp go.mod /tmp/go.mod && cp go.sum /tmp/go.sum && go mod tidy && diff /tmp/go.mod go.mod && diff /tmp/go.sum go.sum"

[[steps]]
name = "format"
run_sh = "cd project && test -z \"$(gofumpt -l -extra .)\" || (gofumpt -l -extra . && exit 1)"

[[steps]]
name = "lint"
run_sh = "cd project && golangci-lint run ./..."

[[steps]]
name = "vulncheck"
warn_on_fail = true
run_sh = "cd project && govulncheck ./..."

[[steps]]
name = "test"
run_sh = "cd project && go test -race -count=1 ./..."

[[steps]]
name = "build"
run_sh = "cd project && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o physiobase ./cmd/physiobase"
publish_file = ["/ci/build/project/physiobase"]

[[steps]]
name = "image"
# Baut das Container-Image und schiebt es in die Registry des Repos:
#   forge.gpl-nas.de/physiobase:latest  (öffentlich pullbar, REGISTRY_PULL=public)
[steps.build_image]
tags = ["$CI_COMMIT_SHORT_SHA", "$CI_COMMIT_TAG", "latest"]

[[steps]]
name = "image-scan"
# Schwachstellen im ausgelieferten Image. HIGH/CRITICAL werden gemeldet, brechen
# den Build aber noch nicht ab (warn_on_fail + --exit-code 0). Zum Blockieren:
# warn_on_fail entfernen und --exit-code 1 setzen.
warn_on_fail = true
run_sh = """
set -euo pipefail
TRIVY_VERSION=0.76.2
curl -sSfL -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
/tmp/trivy image --quiet --no-progress --cache-dir /tmp/trivy-cache \
  --severity HIGH,CRITICAL --exit-code 0 "${CI_REGISTRY}:${CI_COMMIT_SHORT_SHA}"
"""
