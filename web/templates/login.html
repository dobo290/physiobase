{{define "title"}}Anmelden{{end}}
{{define "content"}}
<article class="narrow">
  <h2>Anmelden</h2>
  {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login">
    <label>Benutzername <input name="username" autocomplete="username" required autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Anmelden</button>
  </form>
  {{if .PasskeyLogin}}
  <div class="js-only passkey-login">
    <p class="muted">oder</p>
    <button type="button" class="secondary" data-passkey-login>🔑 Mit Passkey anmelden</button>
    <p class="error" data-passkey-msg hidden></p>
  </div>
  {{end}}
</article>
{{end}}
